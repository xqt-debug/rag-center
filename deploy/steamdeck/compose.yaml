name: rag-center

x-app: &app
  image: ${RAG_IMAGE:?Set the published GHCR digest}
  user: "0:0"
  env_file:
    - app.env
    - path: app-secrets.env
      format: raw
  environment:
    RAG_DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD:?Set a URL-safe password}@db:5432/rag
    RAG_STORAGE_DIR: /data/files
  volumes:
    - ./files:/data/files
  init: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_DB: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *app
    profiles: [tools]
    command: [python, -m, alembic, upgrade, head]
    healthcheck:
      disable: true
  api:
    <<: *app
    restart: unless-stopped
    ports:
      # 公网请求只通过隧道进入，主机端口仅供本机诊断。
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    <<: *app
    restart: unless-stopped
    command: [python, -m, rag_center.worker]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d}
    restart: unless-stopped
    env_file: [cloudflared.env]
    command: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
    depends_on:
      api:
        condition: service_healthy
    # 就绪探针只在容器网络中可用，不发布任何主机端口。
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
