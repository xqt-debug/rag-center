[project]
name = "rag-center"
version = "0.1.0"
description = "Private knowledge management and hybrid retrieval over MCP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "pypdf>=5,<7", "jieba>=0.42.1,<1",
  "mcp>=1.20,<2", "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
