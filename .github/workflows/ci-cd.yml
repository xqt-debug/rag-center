name: CI and Steam Deck deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Install OCR system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libgomp1
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: SQLite tests (including real HTTP MCP and local OCR)
        if: matrix.database == 'sqlite'
        run: uv run pytest -q
      - name: PostgreSQL tests in isolated schemas
        if: matrix.database == 'postgresql'
        run: uv run pytest -q --postgresql

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build

  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAG_IMAGE: ghcr.io/xqt-debug/rag-center@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
      - name: Validate Actions expressions and shell scripts
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -config-file .github/actionlint.yaml
          bash -n deploy/steamdeck/deploy.sh
          bash -n deploy/steamdeck/docker-env.sh
          shellcheck -e SC1091 deploy/steamdeck/*.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s deploy/tests -v
      - name: Validate deployment Compose without starting services
        run: |
          cp deploy/steamdeck/app.env.example deploy/steamdeck/app.env
          cp deploy/steamdeck/cloudflared.env.example deploy/steamdeck/cloudflared.env
          docker compose --env-file deploy/steamdeck/.env.example -f deploy/steamdeck/compose.yaml config --quiet

  image:
    needs: [backend, frontend, deployment-config]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-timeout 5s --health-retries 20
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime, migrations, local OCR and bundled frontend
        env:
          IMAGE: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
        run: |
          docker run --rm \
            -e RAG_DATABASE_URL=sqlite:////app/data/smoke.sqlite \
            -e RAG_EMBEDDING_PROVIDER=local-test \
            -v "$PWD/tests/fixtures:/fixtures:ro" \
            --entrypoint sh "$IMAGE" -ec '
              python -m alembic upgrade head
              python -c "from pathlib import Path; from rag_center.ingestion import parse_document; from rag_center.app import app; assert Path(\"/app/frontend/dist/index.html\").is_file(); assert \"TCP\" in parse_document(\"/fixtures/ocr-note.png\", \"note.png\").text; print(\"Container smoke passed\")"
            '
      - name: Verify PostgreSQL migrations inside the runtime image
        env:
          IMAGE: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
        run: |
          docker run --rm --network host \
            -e RAG_DATABASE_URL=postgresql+psycopg://rag:rag@127.0.0.1:5432/rag \
            --entrypoint python "$IMAGE" -m alembic upgrade head
      - name: Verify served frontend and HTTP health
        env:
          IMAGE: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
        run: |
          docker run -d --name smoke -e RAG_DATABASE_URL=sqlite:////app/data/http.sqlite "$IMAGE"
          trap 'docker rm -f smoke >/dev/null' EXIT
          for attempt in {1..40}; do
            if docker exec smoke python -c 'import urllib.request; r=urllib.request.urlopen("http://127.0.0.1:8000/"); assert "text/html" in r.headers["Content-Type"]; assert "<html" in r.read().decode().lower(); urllib.request.urlopen("http://127.0.0.1:8000/api/health")'; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: steamdeck-deployment
          path: |
            deploy/steamdeck/compose.yaml
            deploy/steamdeck/deploy.sh
            deploy/steamdeck/docker-env.sh
            deploy/steamdeck/cloudflared.env.example
            deploy/steamdeck/HTTPS.md
          if-no-files-found: error
          retention-days: 7
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
        run: |
          docker push "$IMAGE"
          ref=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          digest=${ref##*@}
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.STEAMDECK_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, Linux, X64, steamdeck]
    environment: steamdeck
    concurrency:
      group: steamdeck-deployment
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      RAG_DEPLOY_DIR: ${{ vars.STEAMDECK_DEPLOY_DIR }}
      RAG_IMAGE: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
    steps:
      - name: Skip superseded main commits
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });
            core.setOutput('current', data.object.sha === context.sha ? 'true' : 'false');
      - name: Prepare temporary deployment and credential directories
        if: steps.current.outputs.current == 'true'
        shell: bash
        run: |
          umask 077
          config=$(mktemp -d "$RUNNER_TEMP/rag-docker.XXXXXX")
          bundle=$(mktemp -d "$RUNNER_TEMP/rag-deploy.XXXXXX")
          printf 'DOCKER_CONFIG=%s\nDEPLOY_BUNDLE=%s\n' "$config" "$bundle" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.current == 'true'
        with:
          name: steamdeck-deployment
          path: ${{ env.DEPLOY_BUNDLE }}
      - name: Prepare Rootless Docker and Compose
        if: steps.current.outputs.current == 'true'
        shell: bash
        run: |
          source "$DEPLOY_BUNDLE/docker-env.sh"
          printf '%s\n' "$HOME/bin" "$HOME/.local/bin" >> "$GITHUB_PATH"
          if [[ -n "${DOCKER_HOST:-}" ]]; then
            printf 'DOCKER_HOST=%s\n' "$DOCKER_HOST" >> "$GITHUB_ENV"
          fi
          docker info --format '{{.ServerVersion}}'
          docker compose version
      - uses: docker/login-action@v3
        if: steps.current.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull, back up, migrate and deploy
        if: steps.current.outputs.current == 'true'
        shell: bash
        run: bash "$DEPLOY_BUNDLE/deploy.sh" "$RAG_IMAGE"
      - name: Remove temporary credentials and deployment attachment
        if: always()
        shell: bash
        run: |
          for path in "${DOCKER_CONFIG:-}" "${DEPLOY_BUNDLE:-}"; do
            case "$path" in
              "$RUNNER_TEMP"/rag-docker.*|"$RUNNER_TEMP"/rag-deploy.*) rm -rf -- "$path" ;;
            esac
          done
